name: Playwright

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2

      - name: Show Bun path
        run: |
          echo "Bun path: ${{ steps.setup-bun.outputs.bun-path }}"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Verify Bun from Node
        run: |
          node -e "console.log(process.env.PATH); console.log(require('child_process').execFileSync('bun', ['--version'], { encoding: 'utf8' }))"

      - name: Run tests
        env:
          BUN_PATH: ${{ steps.setup-bun.outputs.bun-path }}
        run: npm test

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
